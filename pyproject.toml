[project]
name = "totem-mcp"
version = "0.1.0"
description = "Persistent memory layer for engineering agents"
readme = "README.md"
authors = [
    { name = "Emiliano Gandini Outeda", email = "emiliano.gandini@protonmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0,<3.0",
    "click>=8.0,<9.0",
    "mcp>=1.0,<2.0",
    "pyturso>=0.7.2",
]

[project.scripts]
totem = "totem_mcp.cli:main"
totem-mcp = "totem_mcp.cli:mcp_main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
