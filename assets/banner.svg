<svg viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1280" height="400" fill="#EDE3CC"/>

  <!-- relaxed grid: a few structural rules, not a full drawn-out grid -->
  <g stroke="#D9C9A3" stroke-width="1">
    <line x1="64" y1="0" x2="64" y2="400"/>
    <line x1="898" y1="0" x2="898" y2="400"/>
  </g>
  <g stroke="#D9C9A3" stroke-width="1">
    <line x1="0" y1="40" x2="1280" y2="40"/>
    <line x1="0" y1="368" x2="1280" y2="368"/>
  </g>

  <!-- label, pulled off the grid line for breathing room -->
  <rect x="104" y="52" width="12" height="12" fill="#B24C28"/>
  <text x="126" y="63" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" letter-spacing="3" fill="#3A2E22">CODING AGENT MEMORY</text>

  <!-- wordmark, carved slab serif against the sans-serif structure -->
  <text x="100" y="192" font-family="Rockwell, Georgia, 'Times New Roman', serif" font-size="132" font-weight="700" letter-spacing="-3" fill="#2A211A">totem</text>

  <!-- rule -->
  <line x1="104" y1="210" x2="740" y2="210" stroke="#2A211A" stroke-width="2"/>

  <!-- tagline, stacked like a totem's own inscriptions -->
  <text x="104" y="236" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" fill="#3A2E22">A totem stands watch over what a tribe has learned.</text>
  <text x="104" y="262" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" fill="#3A2E22">Totem does the same for a codebase.</text>
  <text x="104" y="292" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#8A7860">Decisions, invariants, and gotchas persist across sessions, backed by</text>
  <text x="104" y="312" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#8A7860">evidence, and flagged the moment the code underneath them changes.</text>

  <!-- totem stack, tribal-patterned bands, still built on the grid -->
  <!-- band geometry: x 980-1176 (width 196, center x=1078); each row is 59 tall with a 4px gap -->
  <g>
    <!-- watch / invariant: the eye that keeps watch -->
    <rect x="980" y="48" width="196" height="59" rx="3" fill="#2A211A"/>
    <circle cx="1078" cy="77.5" r="18" fill="none" stroke="#C98A2B" stroke-width="4"/>
    <circle cx="1078" cy="77.5" r="6" fill="#C98A2B"/>

    <!-- decision: diamond row, 4 marks centered on 1012/1056/1100/1144 (symmetric about 1078) -->
    <rect x="980" y="111" width="196" height="59" rx="3" fill="#B24C28"/>
    <g fill="#EDE3CC">
      <path d="M 1000 140.5 L 1012 128.5 L 1024 140.5 L 1012 152.5 Z"/>
      <path d="M 1044 140.5 L 1056 128.5 L 1068 140.5 L 1056 152.5 Z"/>
      <path d="M 1088 140.5 L 1100 128.5 L 1112 140.5 L 1100 152.5 Z"/>
      <path d="M 1132 140.5 L 1144 128.5 L 1156 140.5 L 1144 152.5 Z"/>
    </g>

    <!-- gotcha: zigzag weave, spans 1000-1156 (symmetric margins of 20 either side) -->
    <rect x="980" y="174" width="196" height="59" rx="3" fill="#3F8F82"/>
    <polyline points="1000,220 1026,206 1052,220 1078,206 1104,220 1130,206 1156,220" fill="none" stroke="#2A211A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- rejected idea: crossed marks, same centers as the diamond row, vertically centered on the band -->
    <rect x="980" y="237" width="196" height="59" rx="3" fill="#C98A2B"/>
    <g stroke="#2A211A" stroke-width="4" stroke-linecap="round">
      <line x1="1003" y1="254" x2="1021" y2="279"/>
      <line x1="1021" y1="254" x2="1003" y2="279"/>
      <line x1="1047" y1="254" x2="1065" y2="279"/>
      <line x1="1065" y1="254" x2="1047" y2="279"/>
      <line x1="1091" y1="254" x2="1109" y2="279"/>
      <line x1="1109" y1="254" x2="1091" y2="279"/>
      <line x1="1135" y1="254" x2="1153" y2="279"/>
      <line x1="1153" y1="254" x2="1135" y2="279"/>
    </g>

    <!-- base -->
    <rect x="980" y="300" width="196" height="59" rx="3" fill="#2A211A"/>
  </g>
</svg>
